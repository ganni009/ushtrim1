<DOCTYPE html>

  <html>
    <head>
      <meta chartset="UTF-8">
      <title>Java 1</title>
    </head>
    <body>
      <label>Numri i pare</label>
      <input type="number" id="nr1">
      <br>
      <label>Numri i dyte</label>
      <input type="number" id="nr2">
      <br>
      <button type="submit" onclick="sum()">Mbledhje</button>
      <button type="submit" onclick="sub()">Zbritje</button>
      <button type="submit" onclick="mul()">Shumzim</button>
      <button type="submit" onclick="div()">Pjestim</button>
      <p id="result"></p>
      <br>
      <hr>

      <h1>Rritje/Zbritje te numrit</h1>

      <p id="numri">0</p>
      <button type="submit" onclick="rritje()">Rritje +</button>
      <button type="submit" onclick="zbritje()">Zbritje -</button>
      <script>
        var n=0;
        function rritje() {
            n = n + 1;
            document.getElementById("numri").innerHTML = n;
        }

        function zbritje() {
            n = n - 1;
            document.getElementById("numri").innerHTML = n;
        }

        
        
        function sum()
        {
          var a=Number(document.getElementById('nr1').value);
          var b=Number(document.getElementById('nr2').value);

          var c=a+b;
          document.getElementById('result').innerHTML=c;
        }
        function sub()
        {
          var a=Number(document.getElementById('nr1').value);
          var b=Number(document.getElementById('nr2').value);

          var c=a-b;
          document.getElementById('result').innerHTML=c;
        }
        function mul()
        {
          var a=Number(document.getElementById('nr1').value);
          var b=Number(document.getElementById('nr2').value);

          var c=a*b;
          document.getElementById('result').innerHTML=c;
        }
        function div()
        {
          var a=Number(document.getElementById('nr1').value);
          var b=Number(document.getElementById('nr2').value);
          if(b==0){
          document.getElementById('result').innerHTML="Nuk pjestohet me 0";
          }
          else{var c=a/b; document.getElementById('result').innerHTML=c;}
          
          
          
        }
      </script>
    </body>
  </html>
